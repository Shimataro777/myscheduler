<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>寸法しらべ</title>
<style>
  html, body { margin: 0; }
  body { font-family: -apple-system, sans-serif; background: #fff; color: #141416; }
  /* My手帳とまったく同じ組み立て */
  /* My手帳と同じ：ふつうに縦へ伸びる箱＋下タブは fixed */
  .shell { min-height: 100vh; padding-bottom: calc(env(safe-area-inset-bottom) + 100px); }
  .head { position: sticky; top: 0; background: #fff; padding: calc(env(safe-area-inset-top) + 18px) 20px 8px; border-bottom: 1px solid #E5E5E5; font-weight: 700; }
  .body { padding: 12px 16px 24px; font-size: 13px; line-height: 1.9; }
  .nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff;
    border-top: 1px solid #E5E5E5; display: flex; padding-bottom: env(safe-area-inset-bottom); }
  .nav button { flex: 1; min-height: 48px; padding: 6px 0; display: flex; flex-direction: column;
    align-items: center; gap: 4px; background: none; border: 0; font-size: 11px; line-height: 1.1; color: #737373; }
  .dot { width: 20px; height: 20px; border: 2px solid #737373; border-radius: 6px; }
  b { font-weight: 700; }
  code { background: #F3F3F5; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
  <div class="shell">
    <div class="head">寸法しらべ</div>
    <div class="body" id="out">はかっています…</div>
    <div class="nav" id="nav">
      <button><span class="dot"></span>ひとつ</button>
      <button><span class="dot"></span>ふたつ</button>
      <button><span class="dot"></span>みっつ</button>
      <button><span class="dot"></span>よっつ</button>
    </div>
  </div>
<script>
(function () {
  var out = document.getElementById("out");
  function px(v) { return Math.round(v) + "px"; }
  function run() {
    var shell = document.querySelector(".shell");
    var nav = document.getElementById("nav");
    var sr = shell.getBoundingClientRect();
    var nr = nav.getBoundingClientRect();
    var probe = document.createElement("div");
    probe.style.cssText = "position:fixed;left:-9999px;height:env(safe-area-inset-bottom);";
    document.body.appendChild(probe);
    var safeB = probe.getBoundingClientRect().height;
    probe.style.height = "env(safe-area-inset-top)";
    var safeT = probe.getBoundingClientRect().height;
    probe.style.height = "100dvh";
    var dvh = probe.getBoundingClientRect().height;
    probe.style.height = "100vh";
    var vh = probe.getBoundingClientRect().height;
    document.body.removeChild(probe);
    var vv = window.visualViewport;
    out.innerHTML = [
      "<b>この端末の数字</b>",
      "画面の高さ innerHeight … <b>" + px(window.innerHeight) + "</b>",
      "screen.height … <b>" + px(window.screen.height) + "</b>",
      "visualViewport … <b>" + (vv ? px(vv.height) : "なし") + "</b>",
      "100vh … <b>" + px(vh) + "</b>",
      "100dvh … <b>" + px(dvh) + "</b>",
      "上の逃げ safe-area-top … <b>" + px(safeT) + "</b>",
      "下の逃げ safe-area-bottom … <b>" + px(safeB) + "</b>",
      "",
      "<b>組み立て</b>",
      "本文の高さ … " + px(document.documentElement.scrollHeight),
      "下の帯 … " + px(nr.top) + " 〜 " + px(nr.bottom) + "（高さ <b>" + px(nr.height) + "</b>）",
      "帯の下から画面の下まで … <b>" + px(window.innerHeight - nr.bottom) + "</b>",
      "",
      "standalone（ホーム画面から） … <b>" + (window.navigator.standalone ? "はい" : "いいえ") + "</b>",
      "devicePixelRatio … " + (window.devicePixelRatio || "?"),
    ].join("<br>");
  }
  run();
  window.addEventListener("resize", run);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", run);
})();
</script>
</body>
</html>
