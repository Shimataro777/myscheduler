<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover ＝ ノッチのある機種でも画面の端まで使う -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <title>My手帳</title>
    <meta name="description" content="ひびの記録をつける、じぶんだけの手帳" />
    <meta name="theme-color" content="#FFFFFF" />

    <!-- ホーム画面に置いたとき、上の余白まで深い緑にする -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="My手帳" />

    <!-- 文字の読み込みを少しでも早くするための下ごしらえ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" href="./app.css" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon-v6.png" />
    <link rel="manifest" href="./manifest-v6.json" />

    <style>
      /* 読み込みが終わるまでの間だけ出す絵。
         中身が出たら __hibiHideSplash() で静かに消える */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483600;
        /* アイコンと同じ、白地に水色の手帳。**アプリの帯の色と混ぜないこと** */
        background: #FFFFFF;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
        transition: opacity 320ms ease;
      }
      /* 名前と版数。**版数を大きく出さないこと。**
         目には入るが、読ませるためのものではない */
      #app-splash .name {
        margin-top: 22px;
        font-size: 22px; font-weight: 700; color: #3E7EA6; letter-spacing: .08em;
        opacity: 0;
        animation: hibi-in 520ms cubic-bezier(0.16, 1, 0.3, 1) 220ms forwards;
      }
      #app-splash .ver {
        margin-top: 7px;
        font-size: 11.5px; color: rgba(62,126,166,.55); letter-spacing: .04em;
        opacity: 0;
        animation: hibi-in 520ms cubic-bezier(0.16, 1, 0.3, 1) 300ms forwards;
      }
      #app-splash .mark {
        width: 92px;
        height: 82px;
        border: 5px solid #6FB9E0;
        border-radius: 12px;
        position: relative;
        opacity: 0;
        animation: hibi-in 520ms cubic-bezier(0.16, 1, 0.3, 1) 120ms forwards;
      }
      #app-splash .mark::before {
        content: "";
        position: absolute;
        left: 23px; top: -5px; bottom: -5px;
        width: 5px;
        background: #6FB9E0;
      }
      #app-splash .mark::after {
        content: "";
        position: absolute;
        left: 55px; top: -5px;
        width: 18px; height: 44px;
        background: #6FB9E0;
        clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 74%, 0 100%);
      }
      @keyframes hibi-in {
        from { opacity: 0; transform: translateY(8px) scale(0.96); }
        to   { opacity: 1; transform: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .mark, #app-splash .name, #app-splash .ver { animation: none; opacity: 1; }
        #app-splash { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="app-splash">
      <div class="mark"></div>
      <p class="name">My手帳</p>
      <p class="ver" id="app-splash-ver"></p>
    </div>
    <div id="root"></div>
    <script>
      /* 版数はここひとつで決める。**あちこちに書かないこと**（食い違う）。
         アプリの中からも window.__MT_VERSION で読む */
      /* X＝見た目や操作性の大きな変更・画面の追加
         Y＝細かな機能向上・部分的な追加・画面の手直し
         Z＝不具合や誤字の直し */
      window.__MT_VERSION = "1.8.0";
      document.getElementById("app-splash-ver").textContent = "v" + window.__MT_VERSION;

      /* 消し方は index.html の側に持たせてある。
         こうしておくと、本体の読み込みが失敗しても絵が残り続けない */
      /* **かならず最低の時間だけ見せること。** 読み込みが速い端末では
         一瞬だけ光って消え、かえって目ざわりになる */
      var MT_SPLASH_MS = 1400;
      var mtSplashFrom = Date.now();
      window.__hibiHideSplash = function () {
        var el = document.getElementById("app-splash");
        if (!el || el.dataset.going) return;
        el.dataset.going = "1";
        var wait = Math.max(0, MT_SPLASH_MS - (Date.now() - mtSplashFrom));
        setTimeout(function () {
          el.style.opacity = "0";
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 360);
        }, wait);
      };
      /* 念のため、5秒たったら必ず消す */
      setTimeout(function () { window.__hibiHideSplash(); }, 5000);
    </script>
    <script src="./app.js" defer></script>
  </body>
</html>
