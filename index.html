<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Footprints" />
    <!-- アイコンの名前には版数（-v4）を付けている。
         同じ名前のまま絵だけ差し替えても、端末とGitHubに残った古い画像が
         出続けてアイコンが変わらない。描き替えたら必ず版数を上げること -->
    <link rel="manifest" href="./manifest-v4.json" />
    <link rel="apple-touch-icon" href="./apple-touch-icon-v4.png" />
    <link rel="icon" type="image/png" href="./icon-192-v4.png" />
    <link rel="stylesheet" href="./app.css" />
    <!-- 書体の読み込みを早めるための下ごしらえ（アプリの中からも読み込むが、先に始めておく） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Footprints</title>
    <!-- **版数はここ1か所で決めること。** 起動の画面にも、アプリの中にも同じ値が出る -->
    <script>window.__FT_VERSION = "2.3.2";</script>
    <style>
      /* ============================================================
         起動の画面（スプラッシュ）
         アプリ名と双葉が主役。版数は小さく。くるくるは出さない。
         **このCSSは index.html の中に直接書くこと。**
         別のファイルにすると、そのファイルを読み込むまで白いままになり、
         白い画面を隠すという目的を果たせない
         ============================================================ */
      html, body { margin: 0; background: #F4FBFE; }
      /* **起動の画面が出ているあいだ、アプリの本体は見えなくしておくこと。**
         本体（下の帯や右下のボタン）は、読み込みの途中でも先に描かれる。
         覆いの下に隠れているはずだが、iPhone では下の端（ホームバーのあたり）や、
         覆いが出る前後の一瞬に、下の帯だけが透けて見えることがあった。
         そもそも見えなければ透けようがないので、覆いを外し始めるとき（ふわっと消えるのと同時）まで
         visibility: hidden にしておく。**display: none にしないこと**
         （中の高さを測る部品が、0のまま測ってしまう）。
         印は html に付ける ft-shown。付けるのは下の __ftHideSplash と、いつまでも付かないときの保険の2か所 */
      html:not(.ft-shown) #root { visibility: hidden; }
      #splash {
        /* 上下左右を明示し、高さも大きいほうの画面（bar が引っ込んだときの高さ）まで取っておく。
           inset: 0 だけだと、端末によっては下の端が数十px空く */
        position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 2147483600;
        height: 100vh; height: 100lvh;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #F4FBFE;
        font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
        transition: opacity .45s ease-out;
      }
      #splash.gone { opacity: 0; pointer-events: none; }
      #splash .mark {
        width: 112px; height: 112px; border-radius: 28px; background: #fff;
        box-shadow: 0 8px 26px rgba(12,74,110,.12);
        animation: splash-in .55s cubic-bezier(.22,1,.36,1) backwards;
      }
      @keyframes splash-in { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
      #splash .name {
        margin-top: 20px; font-size: 25px; font-weight: 600; color: #0C4A6E; letter-spacing: .08em;
        animation: splash-in .55s .1s cubic-bezier(.22,1,.36,1) backwards;
      }
      /* 版数は控えめに。目に入るが、読ませるためのものではない */
      #splash .ver {
        margin-top: 8px; font-size: 11.5px; color: rgba(12,74,110,.45); letter-spacing: .04em;
        animation: splash-in .55s .18s cubic-bezier(.22,1,.36,1) backwards;
      }

      /* うまく読み込めなかったときの案内。ふつうに動けば目に触れない */
      .boot { position: absolute; bottom: 0; left: 0; right: 0;
              font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
              color: #404040; padding: 0 24px 32px; max-width: 480px; margin: 0 auto; line-height: 1.8;
              opacity: 0; animation: bootlate 0s 3.5s forwards; }
      @keyframes bootlate { to { opacity: 1; } }
      .boot-h { font-size: 17px; font-weight: 700; color: #0C4A6E; margin-bottom: 4px; }
      .boot ol { padding-left: 1.2em; }
      .boot li { margin-bottom: 10px; }
      .boot code { background: rgba(255,255,255,.7); padding: 1px 5px; border-radius: 4px; font-size: 13px; }

      /* 画面の動きを減らす設定のときは、動かさない */
      @media (prefers-reduced-motion: reduce) {
        #splash .mark, #splash .name, #splash .ver { animation: none; }
        #splash { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- 起動の画面。読み込みが終わり、かつ1秒たつと、ふわっと消える。
         いつまでも消えないときは、うまく読み込めていないので案内を出す -->
    <div id="splash">
      <img class="mark" src="./icon-192-v4.png" alt="" width="112" height="112" />
      <p class="name">Footprints</p>
      <p class="ver" id="splash-ver"></p>
      <div class="boot">
        <p class="boot-h">プログラムを読み込めませんでした</p>
        <p>GitHubで公開している場合は、次の2つをご確認ください。</p>
        <ol>
          <li><code>app.js</code> と <code>app.css</code> が、このファイルと同じ場所に<br>
            アップロードされているか</li>
          <li>Settings → Pages の Source が <b>Deploy from a branch</b> になっているか<br>
            （Branch は保存した場所、Folder は <code>/ (root)</code>）</li>
        </ol>
      </div>
    </div>

    <script>
      document.getElementById("splash-ver").textContent = "v" + window.__FT_VERSION;

      /* 起動の画面を外す手だて。アプリの読み込みが終わったときに呼ばれる。
         **かならず最低の時間だけ見せること。** 読み込みが速い端末では
         一瞬だけ光って消え、かえって目ざわりになる。
         **この処理は index.html の中に直接書くこと。**
         組み立て後のファイルに置くと、それを読み込めなかったときに
         外す手だてごと失われる */
      var FT_SPLASH_MS = 2000;
      var ftSplashFrom = Date.now();
      /* 本体を見せる。起動の画面が消え始めるときに呼ぶ */
      function ftShow() { document.documentElement.classList.add("ft-shown"); }
      /* 保険。アプリが読み込みの完了を知らせてこなくても、いつまでも真っ白にはしない。
         読み込みに失敗しているときは、本体は空なので、案内（.boot）はそのまま見える */
      setTimeout(ftShow, 12000);
      window.__ftHideSplash = function () {
        var el = document.getElementById("splash");
        if (!el || el.dataset.going) return;
        el.dataset.going = "1";
        var wait = Math.max(0, FT_SPLASH_MS - (Date.now() - ftSplashFrom));
        setTimeout(function () {
          ftShow();
          el.classList.add("gone");
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 600);
        }, wait);
      };
    </script>
    <script defer src="./app.js"></script>
  </body>
</html>
