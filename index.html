<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover ＝ ノッチのある機種でも画面の端まで使う -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <title>Hibi</title>
    <meta name="description" content="ひびの記録をつける、じぶんだけの手帳" />
    <meta name="theme-color" content="#57B79B" />

    <!-- ホーム画面に置いたとき、上の余白まで深い緑にする -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hibi" />

    <!-- 文字の読み込みを少しでも早くするための下ごしらえ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon-v3.png" />
    <link rel="manifest" href="./manifest-v3.json" />

    <style>
      /* 読み込みが終わるまでの間だけ出す絵。
         中身が出たら __hibiHideSplash() で静かに消える */
      #hibi-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483600;
        background: #57B79B;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 260ms ease;
      }
      #hibi-splash .mark {
        width: 76px;
        height: 76px;
        border: 5px solid #FFFFFF;
        border-radius: 14px;
        position: relative;
        opacity: 0;
        animation: hibi-in 520ms cubic-bezier(0.16, 1, 0.3, 1) 120ms forwards;
      }
      #hibi-splash .mark::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 5px;
        margin-top: -2.5px;
        background: #FFFFFF;
      }
      @keyframes hibi-in {
        from { opacity: 0; transform: translateY(8px) scale(0.96); }
        to   { opacity: 1; transform: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        #hibi-splash .mark { animation: none; opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="hibi-splash"><div class="mark"></div></div>
    <div id="root"></div>
    <script>
      /* 消し方は index.html の側に持たせてある。
         こうしておくと、本体の読み込みが失敗しても絵が残り続けない */
      window.__hibiHideSplash = function () {
        var el = document.getElementById("hibi-splash");
        if (!el) return;
        el.style.opacity = "0";
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 300);
      };
      /* 念のため、5秒たったら必ず消す */
      setTimeout(function () { window.__hibiHideSplash(); }, 5000);
    </script>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
