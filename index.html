<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#d6ebf9">
<meta name="apple-mobile-web-app-title" content="4つ並べ">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>4つ並べ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;800&display=swap" rel="stylesheet">
<style>
/* VOICE: 朝のカフェのテーブル。光るアクリル盤と木琴の音。迷わない、明るい対戦。
   IDEA: 正面いっぱいに透明アクリルの四目並べ。クロームの脚、木のテーブル。
   PICTURE: 盤が画面の高さいっぱい。上に▼と浮かぶ次のチップ。
   COLOUR and TYPE: 木の茶と窓の光、みずいろ(#2cc3f2)とピンク(#ff5c9e)。太い丸ゴシック。
   LAYOUT: 左右の上に両プレイヤー（手番が色で光る）、左下「1手もどる」、右下「音」「最初から」、終了後は下中央に「もう一度あそぶ」。 */
:root{color-scheme:light;--ink:#2b231c;--ca:#12a8f0;--cb:#ff3d8b;--card:rgba(255,255,255,.88);--line:rgba(40,25,10,.12)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#d6ebf9;color:var(--ink);font:700 16px/1.3 -apple-system,"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#stage{position:fixed;left:0;top:0;width:100vw;height:100vh;width:100dvw;height:100dvh;transform-origin:0 0;overflow:hidden;container-type:size;--t:max(10px,env(safe-area-inset-top));--r:max(12px,env(safe-area-inset-right));--bt:max(10px,env(safe-area-inset-bottom));--l:max(12px,env(safe-area-inset-left))}
body.rot #stage{width:100vh;height:100vw;width:100dvh;height:100dvw;transform:rotate(90deg) translateY(-100%);--t:10px;--r:max(12px,env(safe-area-inset-top));--bt:10px;--l:max(12px,env(safe-area-inset-bottom))}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#c{touch-action:none}
.dot{width:34px;height:34px;border-radius:50%;flex:none;background:radial-gradient(circle at 34% 28%,#fff 0 10%,color-mix(in srgb,var(--c) 45%,#fff) 26%,var(--c) 62%,color-mix(in srgb,var(--c) 75%,#000) 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.55)}
.ico{position:absolute;bottom:var(--bt);width:40px;height:40px;display:grid;place-items:center;padding:0;border-radius:50%;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);color:#fff;cursor:pointer;opacity:.75;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .2s}
.ico:hover{opacity:1}
.ico svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
#restart{right:var(--r)}#snd{right:calc(var(--r) + 50px)}
.edge{position:absolute;top:0;bottom:0;width:26%;pointer-events:none;opacity:0;transition:opacity .6s}
#e0{left:0;background:linear-gradient(90deg,color-mix(in srgb,var(--ca) 42%,transparent),transparent)}
#e1{right:0;background:linear-gradient(270deg,color-mix(in srgb,var(--cb) 42%,transparent),transparent)}
body.t0 #e0,body.t1 #e1{opacity:1}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.ico:active{transform:scale(.92)}
.ov{position:absolute;inset:0;display:grid;place-items:center;padding:16px;z-index:5;background:rgba(20,14,8,.45)}
.ov[hidden]{display:none}
.card{width:min(380px,100%);padding:22px 20px 18px;border-radius:26px;background:#fffaf3;text-align:center;box-shadow:0 30px 70px -20px rgba(0,0,0,.6);animation:rise .5s cubic-bezier(.3,1.4,.5,1)}
@keyframes rise{from{translate:0 24px;scale:.9;opacity:0}}
.big{width:72px;height:72px;margin:0 auto 6px}
.card h2{margin:0;font-size:34px;line-height:1.15;color:var(--c)}
.card p{margin:6px 0 16px;font-size:15px;color:#7b6a59}
.row{display:flex;gap:8px}
.row button{flex:1;min-height:50px;border-radius:16px;border:1px solid var(--line);background:#fff;font:inherit;font-size:16px;color:var(--ink);cursor:pointer}
.row .go{background:var(--c);border-color:transparent;color:#fff}
#err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:#fff}

#winOv{background:radial-gradient(55% 65% at var(--wx,50%) 48%,color-mix(in srgb,var(--c) 38%,transparent),rgba(12,9,6,.62));backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);animation:fade .8s ease}
@keyframes fade{from{opacity:0}}
.vic{display:flex;flex-direction:column;align-items:center;text-align:center;color:#fff}
.vic small{font:500 clamp(13px,2.6cqh,16px)/1 "Shippori Mincho B1",serif;letter-spacing:.5em;margin-right:-.5em;opacity:.85;animation:up .45s both}
.vic h2{margin:.12em 0 .08em;font:800 clamp(64px,19cqh,140px)/1 "Shippori Mincho B1","Hiragino Mincho ProN",serif;letter-spacing:.08em;margin-right:-.08em;
 background:linear-gradient(105deg,#fff 0%,#fff 38%,color-mix(in srgb,var(--c) 30%,#fff) 46%,#fffbe6 50%,color-mix(in srgb,var(--c) 30%,#fff) 54%,#fff 62%,#fff 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 0 22px color-mix(in srgb,var(--c) 80%,transparent)) drop-shadow(0 2px 6px rgba(0,0,0,.35));animation:reveal 1.2s cubic-bezier(.2,.8,.2,1) both,shine 3.2s 1s linear infinite}
.vic .rule{width:min(260px,50cqw);height:1px;background:linear-gradient(90deg,transparent,#fff,transparent);opacity:.8;animation:grow .6s .05s both}
.vic .acts{display:flex;gap:14px;align-items:center;margin-top:clamp(16px,5cqh,30px);animation:up .45s .1s both}
.vic .acts button{min-height:48px;border-radius:999px;font:inherit;font-size:16px;cursor:pointer;padding:0 26px}
#again2{min-height:52px;padding:0 30px;border-radius:999px;font:inherit;font-size:16px;cursor:pointer;background:#fff;color:var(--ink);border:0;box-shadow:0 10px 30px -10px color-mix(in srgb,var(--c) 90%,transparent);animation:up .45s .1s both}
#winOv .links.wl{margin-top:8px;animation:up .45s .12s both}
#winTxt[hidden]{display:none}
#winOv #winTxt{margin-bottom:18px}
#winOv .side{position:absolute;top:0;bottom:0;width:30%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;pointer-events:none}
#res0{left:0;--c:var(--ca)}#res1{right:0;--c:var(--cb)}
#winOv .side[hidden]{display:none}
#winOv .wchip{display:block;width:clamp(44px,13cqh,70px);aspect-ratio:1;margin-top:clamp(8px,2.4cqh,16px)}
#winOv .side.lose .wchip{width:clamp(36px,10cqh,56px)}
#winOv .side small{font-size:12px;letter-spacing:.3em;margin-right:-.3em;color:rgba(255,255,255,.8);animation:up .45s .06s both}
#winOv .side b{font:800 clamp(40px,12cqh,80px)/1 "Hiragino Mincho ProN","Shippori Mincho B1",serif;letter-spacing:.12em;margin-right:-.12em}
#winOv .side.win b{background:linear-gradient(105deg,#fff 0%,#fff 38%,color-mix(in srgb,var(--c) 35%,#fff) 46%,#fffbe6 50%,color-mix(in srgb,var(--c) 35%,#fff) 54%,#fff 62%,#fff 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 20px color-mix(in srgb,var(--c) 85%,transparent)) drop-shadow(0 2px 6px rgba(0,0,0,.35));animation:reveal 1.2s cubic-bezier(.2,.8,.2,1) both,shine 3.2s 1s linear infinite}
#winOv .side.lose b{font-size:clamp(30px,8.5cqh,56px);color:rgba(255,255,255,.5);filter:drop-shadow(0 2px 6px rgba(0,0,0,.3));animation:up .45s .08s both}

@keyframes reveal{from{opacity:0;transform:scale(1.25);filter:blur(14px)}}
@keyframes shine{from{background-position:100% 0}to{background-position:-200% 0}}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes grow{from{transform:scaleX(0)}}
.acts[hidden],.digits[hidden],.ost[hidden]{display:none!important}
.from{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:6px 16px 6px 10px;border-radius:999px;font-size:13px;letter-spacing:.12em;color:#fff;border:1px solid color-mix(in srgb,var(--oc,#fff) 70%,transparent);background:linear-gradient(160deg,color-mix(in srgb,var(--oc,#fff) 35%,transparent),rgba(20,14,10,.35));box-shadow:0 0 24px -6px var(--oc,#fff);animation:up .5s both}
.from i{width:10px;height:10px;border-radius:50%;background:var(--oc,#fff);box-shadow:0 0 10px var(--oc,#fff)}
.from[hidden]{display:none}
#reqOv{background:radial-gradient(60% 70% at 50% 50%,rgba(60,48,40,.25),rgba(12,9,6,.6));animation:fade .4s ease;z-index:6}
#askOv{background:radial-gradient(60% 70% at 50% 50%,rgba(60,48,40,.25),rgba(12,9,6,.6));animation:fade .4s ease}
.vic h2.ask{font-size:clamp(28px,7.5cqh,46px);letter-spacing:.06em;margin-right:-.06em;background:none;color:#fff;filter:drop-shadow(0 2px 10px rgba(0,0,0,.4));animation:up .5s both}
.pillw,.pillo{min-height:48px;border-radius:999px;font:inherit;font-size:16px;cursor:pointer;padding:0 26px}
.pillw{background:#fff;color:var(--ink);border:0}
.pillo{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5)}
#pickOv{background:radial-gradient(60% 70% at 50% 50%,rgba(60,48,40,.2),rgba(12,9,6,.5));animation:fade .8s ease;transition:opacity .55s ease}
#pickOv.leaving{opacity:0;pointer-events:none}
#toast{position:absolute;left:0;right:0;top:65%;z-index:4;display:flex;justify-content:center;pointer-events:none;opacity:0;transition:opacity .5s}
#toast.on{opacity:1}
#toast div{font:800 clamp(34px,9cqh,60px)/1 "Hiragino Mincho ProN","Shippori Mincho B1","Yu Mincho",serif;letter-spacing:.3em;margin-right:-.3em;color:#fff;text-shadow:0 0 24px var(--c),0 0 6px var(--c),0 3px 10px rgba(0,0,0,.35);transform:scale(.9);transition:transform .6s cubic-bezier(.2,1.4,.4,1)}
#toast.on div{transform:none}

.corner{position:absolute;display:none;pointer-events:none}
#pickOv.cmode .corner{display:block}
.corner i{position:absolute;inset:0}
.corner::before{content:"";position:absolute;inset:-35%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 70%,transparent) 20%,transparent 68%);opacity:.75}
#k0{--c:var(--ca)}#k1{--c:var(--cb)}
.links{display:flex;align-items:center;gap:14px;margin-top:clamp(12px,3.5cqh,22px);animation:up .45s .1s both}
.lnk{display:inline-flex;align-items:center;gap:6px;padding:8px 4px;background:none;border:0;color:rgba(255,255,255,.78);font:inherit;font-size:13px;letter-spacing:.04em;cursor:pointer;transition:color .2s}
.lnk:hover,.lnk:focus-visible{color:#fff}
.lnk svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sep{width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.45)}
.lnk.back{margin-top:clamp(8px,2.5cqh,16px);font-size:13px}
.vic h2.sm{font-size:clamp(24px,6.5cqh,38px)}
.tiles{display:flex;gap:14px;margin-top:clamp(12px,3.5cqh,22px)}
.tile{width:clamp(150px,22cqw,190px);padding:16px 14px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.28);background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.04));color:#fff;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .2s,background .2s,border-color .2s}
.tile:hover{background:linear-gradient(160deg,rgba(255,255,255,.24),rgba(255,255,255,.08));border-color:rgba(255,255,255,.5)}
.tile:active{transform:scale(.97)}
.tile svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.tile b{font-size:15px;font-weight:700;letter-spacing:.04em}
.vic .tile small{font:500 11.5px/1.3 -apple-system,"Hiragino Sans",system-ui,sans-serif;letter-spacing:.02em;margin:0;opacity:.65;animation:none}
.digits{position:relative;display:flex;gap:clamp(8px,1.6cqw,14px);margin-top:clamp(12px,3.5cqh,22px)}
.digits span{width:clamp(40px,11cqh,62px);aspect-ratio:.8;display:grid;place-items:center;border-radius:16px;background:linear-gradient(170deg,rgba(255,255,255,.18),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.3);font:800 clamp(30px,8.5cqh,46px)/1 "Hiragino Mincho ProN","Shippori Mincho B1",serif;color:#fff;font-variant-numeric:tabular-nums;transition:border-color .2s,background .2s}
.digits.in{cursor:text}
.digits.in span.cur{border-color:#fff;background:linear-gradient(170deg,rgba(255,255,255,.26),rgba(255,255,255,.08))}
.digits.in span.cur:empty::after{content:"";width:2px;height:40%;background:#fff;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.digits input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;padding:0;color:transparent;background:transparent;caret-color:transparent}
.ost{display:flex;align-items:center;gap:8px;margin:12px 0 0;font-size:12.5px;letter-spacing:.04em;color:rgba(255,255,255,.75);min-height:1.4em}
.ost::after{content:"";width:6px;flex:none}
.pulse{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.7);flex:none}
.ost.wait .pulse{animation:pulse 1.2s ease-in-out infinite}
.ost.ok .pulse{background:#7ee0a0}.ost.ng .pulse{background:#ff8a8a}
@keyframes pulse{50%{transform:scale(1.8);opacity:.35}}
.setcol{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2.2cqh,14px);margin-top:clamp(10px,2.6cqh,18px)}
.setitem{display:flex;flex-direction:column;align-items:center;gap:6px}
.setitem .lb{font-size:11.5px;letter-spacing:.24em;margin-right:-.24em;color:rgba(255,255,255,.6)}
.setitem .seg,.setitem .colorpv{width:clamp(300px,44cqw,360px);box-sizing:border-box}
.seg{display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:4px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.03));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.seg button{min-height:clamp(36px,9.6cqh,44px);border:0;border-radius:999px;background:none;color:rgba(255,255,255,.75);font:600 13px/1 -apple-system,"Hiragino Sans",system-ui,sans-serif;letter-spacing:.04em;cursor:pointer;transition:background .2s,color .2s}
.colorpv{position:relative;display:grid;grid-template-columns:1fr 1fr;align-items:center;height:clamp(46px,12cqh,54px);padding:0 30px 0 6px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.04));color:#fff;font:inherit;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.colorpv .who{display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px}
.colorpv .who+.who{border-left:1px solid rgba(255,255,255,.2)}
.colorpv .who small{font-size:11px;opacity:.65;letter-spacing:.06em}
.colorpv .who b{font-weight:700}
.colorpv .pvchip{width:clamp(26px,7.5cqh,32px);aspect-ratio:1;flex:none}
.colorpv svg{position:absolute;right:10px;top:50%;margin-top:-7px;width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.6}
.cside .who{font-size:11px;letter-spacing:.2em;color:rgba(255,255,255,.6);margin-bottom:-4px}
#reacts{position:absolute;left:var(--l);bottom:var(--bt);z-index:3;display:none;gap:6px}
body.online.playing #reacts{display:flex}
#reacts button{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:linear-gradient(160deg,rgba(40,30,22,.45),rgba(20,14,10,.3));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:19px;line-height:1;cursor:pointer;padding:0;transition:transform .1s}
#reacts button:active{transform:scale(.9)}
.fly{position:absolute;z-index:4;font-size:34px;pointer-events:none;animation:fly 1.8s cubic-bezier(.2,.7,.3,1) forwards;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
@keyframes fly{0%{opacity:0;transform:translate(-50%,10px) scale(.5)}15%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-120px) scale(1)}}
#thinking{position:absolute;z-index:3;transform:translateX(-50%);white-space:nowrap;display:none;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:11.5px;letter-spacing:.12em;border:1px solid rgba(255,255,255,.3);background:linear-gradient(160deg,rgba(40,30,22,.5),rgba(20,14,10,.35));color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);pointer-events:none}
body.online.oppturn #thinking{display:flex}
#thinking i{width:4px;height:4px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}#thinking i:nth-child(2){animation-delay:.2s}#thinking i:nth-child(3){animation-delay:.4s}
.jwrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;width:100%;margin-top:clamp(8px,2cqh,14px)}
.jwrap .jleft{grid-column:1;justify-self:end;margin-right:clamp(18px,5cqw,48px)}
.jwrap .pad{grid-column:3;justify-self:start;margin-left:clamp(18px,5cqw,48px)}
.jwrap::before{content:"";grid-column:2;grid-row:1}
.jleft{display:flex;flex-direction:column;align-items:center}
.jleft .digits{margin-top:0}
.pad{display:grid;grid-template-columns:repeat(3,auto);gap:clamp(5px,1.4cqh,10px);animation:up .45s .08s both}
.pad button{width:clamp(40px,12.5cqh,60px);aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.04));color:#fff;font:600 clamp(19px,5cqh,24px)/1 -apple-system,"Hiragino Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background .15s,transform .1s}
.pad button:active{background:rgba(255,255,255,.32);transform:scale(.94)}
.pad button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
@container (max-width:520px){.jwrap{flex-direction:column;gap:14px}}
.glass{border:1px solid rgba(255,255,255,.3);background:linear-gradient(160deg,rgba(40,30,22,.55),rgba(20,14,10,.4));color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 26px -14px rgba(0,0,0,.6)}
#youTag{position:absolute;z-index:3;transform:translateX(-50%);padding:4px 12px 4px 10px;border-radius:999px;font-size:11.5px;letter-spacing:.18em;pointer-events:none;display:none;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.3);background:linear-gradient(160deg,rgba(40,30,22,.5),rgba(20,14,10,.35));color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#youTag::before{content:"";width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff}
body.online #youTag{display:flex}
#notice{position:absolute;left:50%;top:16%;z-index:7;transform:translate(-50%,-6px);padding:9px 18px;border-radius:999px;font-size:13px;letter-spacing:.06em;pointer-events:none;opacity:0;transition:opacity .4s,transform .4s;white-space:nowrap;border:1px solid rgba(255,255,255,.3);background:linear-gradient(160deg,rgba(40,30,22,.62),rgba(20,14,10,.5));color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#notice.on{opacity:1;transform:translate(-50%,0)}
.view .acts{animation:up .45s .08s both}
.view .lnk.back{animation:up .45s .12s both}
.view{display:flex;flex-direction:column;align-items:center;animation:up .5s both}
.view[hidden]{display:none}
.cbtn{display:inline-flex;align-items:center;gap:8px;margin-top:clamp(12px,3.5cqh,22px);min-height:40px;padding:0 18px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-size:14px;cursor:pointer;opacity:.85;animation:up .45s .1s both}
.cbtn:hover{opacity:1;background:rgba(255,255,255,.14)}
.cbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cbtn.done{background:#fff;color:var(--ink);border:0;opacity:1;padding:0 30px;min-height:46px;font-size:16px}
.vic.pick{width:100%}
#vColor,#vRoom,#vJoin{align-self:stretch}
.csides{width:min(980px,96%);display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:clamp(8px,2.5cqh,18px)}
.cside{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 14px;border-radius:24px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14)}
.cside .cn{font-size:16px;color:#fff;letter-spacing:.04em}
.csides .cbtn.done{margin-top:0;flex:none}
.sw{display:grid;grid-template-columns:repeat(3,auto);gap:6px}
.sw button{width:clamp(40px,12cqh,58px);aspect-ratio:1;padding:0;border:0;background:none;cursor:pointer;border-radius:50%;position:relative}
.sw button i{position:absolute;inset:8%;border-radius:50%}
.sw button::before{content:"";position:absolute;inset:-6%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--s) 75%,transparent) 30%,transparent 70%);opacity:0;transition:opacity .3s}
.sw button::after{content:"";position:absolute;inset:-1%;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 12px rgba(255,255,255,.6);opacity:0;transform:scale(.8);transition:opacity .3s,transform .35s cubic-bezier(.2,1.5,.4,1)}
.sw button.cur::before{opacity:1}.sw button.cur::after{opacity:1;transform:none}
.sw button:disabled{cursor:default}
.pick h2{font-size:clamp(30px,8cqh,52px);letter-spacing:.06em;margin-right:-.06em;animation:up .45s both;background:none;color:#fff;filter:drop-shadow(0 2px 10px rgba(0,0,0,.4))}
.gems{display:flex;gap:clamp(10px,2.4cqw,18px);align-items:stretch;margin-top:clamp(14px,4cqh,26px);animation:up .45s .06s both}
.gem{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2cqh,12px);width:clamp(112px,17cqw,148px);padding:clamp(12px,3cqh,18px) 10px clamp(10px,2.6cqh,14px);border-radius:22px;border:1px solid rgba(255,255,255,.28);background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.04));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font:600 14px/1 -apple-system,"Hiragino Sans",system-ui,sans-serif;letter-spacing:.04em;cursor:pointer;transition:border-color .25s,background .25s,transform .15s,box-shadow .25s}
.gem b{font-weight:700}
.gem:hover,.gem.hl{border-color:rgba(255,255,255,.75);background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,.08));box-shadow:0 0 26px -6px var(--c,#fff)}
.gem:active{transform:scale(.96)}
.gem.dim{opacity:.45}
.dice{display:grid;place-items:center}
.dice svg{width:92%;height:92%;fill:none;stroke:#fff;stroke-width:2.2}.dice svg circle{fill:#fff;stroke:none}
#gR:hover .dice svg,#gR:active .dice svg{animation:roll .6s ease}
@keyframes roll{50%{transform:rotate(-18deg) scale(1.08)}}
.gem i{position:relative;display:block;width:clamp(48px,12cqh,70px);aspect-ratio:1;perspective:420px}
.gem i{transition:transform .25s}.gem:hover i{transform:translateY(-3px)}
#pickGL{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
.gem i::before{content:"";position:absolute;inset:-10%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 55%,transparent),transparent 70%);opacity:.6;transition:opacity .3s}
.gem:hover i::before,.gem.hl i::before{opacity:1}
.gem.dim i::before{opacity:0}
#g0{--c:var(--ca)}#g1{--c:var(--cb)}
@media (prefers-reduced-motion:reduce){.card,#winOv,#pickOv,.vic *{animation:none!important}}
/* 文字のボタンはすべて透明感のあるガラス調に統一（主ボタンは少し明るく） */
.pillw,.pillo,#again2,.cbtn,.cbtn.done,.lnk{color:#fff;border:1px solid rgba(255,255,255,.34);background:linear-gradient(160deg,rgba(255,255,255,.17),rgba(255,255,255,.04));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:inset 0 1px 0 rgba(255,255,255,.18);transition:background .2s,border-color .2s,transform .1s}
.pillw,#again2,.cbtn.done{border-color:rgba(255,255,255,.7);background:linear-gradient(160deg,rgba(255,255,255,.34),rgba(255,255,255,.1));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 24px -10px rgba(255,255,255,.35)}
.pillw:hover,.pillo:hover,#again2:hover,.cbtn:hover,.lnk:hover{background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,.08))}
.pillw:active,.pillo:active,#again2:active,.cbtn:active,.lnk:active{transform:scale(.97)}
.lnk{min-height:34px;padding:0 14px;border-radius:999px;font-size:12.5px;opacity:1}
.links .sep{display:none}
.links{gap:8px}
.seg button.on{background:linear-gradient(160deg,rgba(255,255,255,.4),rgba(255,255,255,.14));color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.65)}
/* 勝敗の画面：「もう一度対戦」を主役として大きく、下の2つは同じ幅で揃える */
#winCard{width:clamp(170px,22cqw,210px)}
#winOv .side{width:36%}
#winOv .side b{font-size:clamp(54px,17cqh,110px)}
#winOv .side.lose b{font-size:clamp(42px,12.5cqh,78px);color:rgba(255,255,255,.66)}
#winOv .wchip{width:clamp(50px,15cqh,80px)}
#winOv .side.lose .wchip{width:clamp(42px,12cqh,64px)}
#winOv #again2{width:100%;min-height:clamp(52px,14cqh,60px);font-size:17px;letter-spacing:.08em;border-color:rgba(255,255,255,.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent),0 12px 34px -10px color-mix(in srgb,var(--c) 80%,transparent)}
#winOv #quit2{width:100%;margin-top:12px;min-height:44px;font-size:14px}
#winCard{pointer-events:auto}
[hidden]{display:none!important}
/* ボタンの決まり
   大（決定・選択の操作）… 高さ48px・文字15px・最小幅128px。見出しの下、同じ間隔で中央に並べる
   小（設定・移動の補助）… 高さ34px・文字12.5px・アイコン付き。大ボタンの下に小さく並べる */
.pillw,.pillo,#again2,.cbtn.done{min-height:48px;min-width:128px;padding:0 22px;border-radius:999px;font:600 15px/1 -apple-system,"Hiragino Sans",system-ui,sans-serif;letter-spacing:.04em;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.lnk,.cbtn:not(.done){min-height:34px;min-width:0;padding:0 14px;font:600 12.5px/1 -apple-system,"Hiragino Sans",system-ui,sans-serif;letter-spacing:.04em}
.vic .acts,.csides .cbtn.done{margin-top:clamp(16px,4cqh,24px)}
.csides .cbtn.done{margin-top:0}
.links,.lnk.back,#winOv .links.wl{margin-top:clamp(12px,3cqh,16px)}
#winOv #again2{margin-top:0}
.vic .acts{gap:12px}
#splash{position:fixed;inset:0;z-index:50;transition:opacity .9s ease,visibility .9s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
 background:repeating-linear-gradient(-28deg,transparent 0 120px,rgba(255,255,255,.16) 120px 200px,transparent 200px 330px),radial-gradient(90% 90% at 50% 38%,#f4fbff,#d6ebf9 55%,#b3d4ee);transition:opacity .6s ease,visibility .6s}
#splash.out{opacity:0;visibility:hidden}
#ver{display:block;margin-top:6px;text-align:center;animation:sIn .9s cubic-bezier(.2,1.4,.4,1) both;font:500 11px/1 -apple-system,"Hiragino Sans",system-ui,sans-serif;letter-spacing:.08em;color:rgba(44,74,102,.55);font-variant-numeric:tabular-nums}
@media (orientation:portrait){#splash{inset:auto;left:0;top:0;width:100vh;width:100dvh;height:100vw;transform-origin:0 0;transform:rotate(90deg) translateY(-100%)}}#splash.out img,#splash.out p,#splash.out i{transform:scale(1.08);transition:transform .9s ease}
#splash img{width:clamp(96px,22vmin,150px);height:auto;aspect-ratio:1;border-radius:22.5%;box-shadow:0 18px 40px -14px rgba(30,70,110,.45),0 0 0 1px rgba(255,255,255,.7);animation:sIn .9s cubic-bezier(.2,1.4,.4,1) both}
#splash p{margin:0;font:700 clamp(24px,5.5vmin,34px)/1 "Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;letter-spacing:.14em;margin-right:-.14em;color:#2c4a66;animation:sIn .9s cubic-bezier(.2,1.4,.4,1) both}
#splash i{display:block;width:min(140px,30vmin);height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#fff 45%,#fff 55%,transparent) -140px 0/140px 100% no-repeat,rgba(44,74,102,.15);animation:sBar 1.2s linear infinite}
@keyframes sIn{from{opacity:0;transform:scale(.7)}}
@keyframes sUp{from{opacity:0;transform:translateY(8px)}}
@keyframes sBar{to{background-position:140px 0,0 0}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}

/* すりガラスのぼかしは、アニメーション中に後から現れるちらつきの原因になるため使わない（背景のにじみは色で表現） */
.ov,.ov *,#notice,#youTag,#thinking,#tapHint{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.pillw,.pillo,#again2,.cbtn,.lnk,.gem,.tile,.seg,.colorpv,.pad button,.digits span,.cside{background-color:rgba(30,22,16,.28)}
#notice,#youTag,#thinking{background-color:rgba(24,18,12,.55)}
#quit2{animation:up .45s .14s both}
</style>
</head>

  document.body.classList.toggle('oppturn', oppTurn && !over && !choosing);
  if (oppTurn) { const tx = cellPos(oppSel >= 0 ? oppSel : 3, 0).x; ghosts.forEach(g => g.position.x += (tx - g.position.x) * Math.min(1, dt * 10)); }
  ghosts.forEach((g, p) => {
    const want = gShow && p === turn, u = g.userData;
    u.k = Math.max(0, Math.min(1, (u.k || 0) + (want ? dt * 4 : -dt * 8)));
    g.visible = u.k > 0;
    const e = 1 - Math.pow(1 - u.k, 3);
    g.scale.setScalar(.6 + .4 * e);
    g.position.y = PH + 1.0 + (1 - e) * .5 + (still ? 0 : Math.sin(now / 320) * .07);
  });
  lane.material.opacity += ((armed && !over && !choosing ? .16 + .05 * Math.sin(now / 300) : 0) - lane.material.opacity) * .2;
  const showR = armed && !over && !choosing && sel >= 0;
  ripples.forEach((r, i) => {
    r.visible = showR;
    if (!showR) return;
    const k = ((now / 1400) + i * .5) % 1;
    r.position.set(cellPos(sel, 0).x, ghosts[turn].position.y, CR * .2);
    r.scale.setScalar(1 + k * .7);
    r.material.opacity = (1 - k) * (k < .12 ? k / .12 : 1) * .75;
  });
  tris.forEach(t => {
    const on = t.userData.on && t.visible, k = Math.min(1, dt * 12);
    t.material.opacity += ((on ? 1 : 0) - t.material.opacity) * k;
    t.scale.setScalar(t.scale.x + ((on ? 1 : .6) - t.scale.x) * k);
    t.position.y = PH + .36 + (on && !still ? Math.sin(now / 250) * .06 : 0);
  });
  renderer.render(scene, camera);
  renderPick(dt);
  if (!loop.shown) { loop.shown = true; window.hideSplash(); setTimeout(() => loadMqtt().catch(() => {}), 3500); }
  requestAnimationFrame(loop);
}
layout(); openPick(true);
requestAnimationFrame(loop);
}
</script>
